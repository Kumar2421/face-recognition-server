services:
  ui:
    image: node:20
    container_name: face_ui
    working_dir: /app
    volumes:
      - ./ui:/app
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8001}
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - face_service

  face_service:
    container_name: face_service
    restart: unless-stopped
    depends_on:
      - qdrant
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ./input:/data/input:ro
      - ./facefolder:/data/facefolder:ro
      - ./buffalo_l/models:/models:ro
      - ./data/thumbs:/data/thumbs
      - ./data/images:/data/images
      - ./images/events:/data/events
      - ./data/trt_cache:/data/trt_cache
      - ./config.yaml:/app/config.yaml:ro

    environment:
      # - FACE_DIR=/media/frigate/facefolder/security
      - FACE_DIR=/data/facefolder/security
      - CONFIG_PATH=/app/config.yaml
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=frigate_faces_v24
      # - QDRANT_COLLECTION=frigate_faces_v10
      # - QDRANT_COLLECTION=frigate_faces_v3
      # - QDRANT_COLLECTION=frigate_faces_v2
      # - QDRANT_COLLECTION=frigate_faces old emp db
      - QDRANT_HNSW_EF=64
      - QDRANT_EXACT=0
      - BUFFALO_MODEL_ROOT=/models
      - BUFFALO_MODEL_NAME=buffalo_l
      - BUFFALO_DET_SIZE=640
      - FACE_SERVICE_DEBUG=1
      - BUFFALO_MIN_DET_SCORE=0.3
      - BUFFALO_ENABLE_FALLBACK_VARIANTS=0
      - BUFFALO_PROVIDERS=TensorrtExecutionProvider,CUDAExecutionProvider,CPUExecutionProvider
      - ORT_TENSORRT_ENGINE_CACHE_ENABLE=1
      - ORT_TENSORRT_CACHE_PATH=/data/trt_cache
      - ORT_TENSORRT_FP16_ENABLE=1
      - FACE_EMBEDDINGS_INDEX=/data/facefolder/security_embeddings/index.json
      - GPU_INFERENCE_MANAGER=1
      - GPU_QUEUE_MAX=256
      - GPU_BATCH_WINDOW_MS=0
      - FACE_SERVICE_MAX_FACES_PER_IMAGE=1
      - FACE_SERVICE_FORCE_SINGLE_FACE=1
      - FACE_MIN_RESOLUTION=40
      - FACE_QUALITY_FACE_RATIO_MIN=0.01
      - FACE_QUALITY_BLUR_MIN=35
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://face.service.tools.thefusionapps.com}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AUTO_ADD_EMBEDDING_ENABLE=1
      - AUTO_ADD_EMBEDDING_MIN_SIM=0.80
      - SUBJECT_MAX_EMBEDDINGS=10
      - ENROLL_DUPLICATE_CHECK_ENABLE=1
      - ENROLL_DUPLICATE_MIN_SIM=0.80
      - NO_MATCH_AUTO_ENROLL_ENABLE=1
      - NO_MATCH_AUTO_ENROLL_PREFIX=visiter
      - NO_MATCH_AUTO_ENROLL_BLOCK_MIN_SIM=0.70
      - DATE_WISE_RECOGNITION_FALLBACK_MASTER=0
      - NO_MATCH_AUTO_ATTACH_MIN_SIM=0.55
      - NO_MATCH_AUTO_ATTACH_MIN_MARGIN=0.08
    ports:
      - "8001:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # sftp_poller:
  #   container_name: sftp_poller
  #   restart: unless-stopped
  #   depends_on:
  #     - face_service
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: ["python3.11", "sftp_poller.py"]
  #   environment:
  #     - CONFIG_PATH=/app/config.yaml
  #     - API_BASE_URL=http://face_service:8000
  #     - SFTP_API_PATH=/v1/events/recognition
  #     - SFTP_BASE_PATH=
  #     - SFTP_CAMERAS_ALLOWLIST=EM-DEPT-Entrance,EM-DEPT-EXIT,BR=TMJ-CBE__ZN=Basement__IO=EXIT__CAM=Basement-Lift,BR=TMJ-CBE__ZN=FirstFloor__IO=ENTRY__CAM=FF-Lift-Entry,BR=TMJ-CBE__ZN=FirstFloor__IO=ENTRY__CAM=FirstFloor-Lift,BR=TMJ-CBE__ZN=GF-Billing__IO=BILLING__CAM=GF-Billing-1,BR=TMJ-CBE__ZN=GF-Billing__IO=BILLING__CAM=GF-Billing-2,BR=TMJ-CBE__ZN=GroundFloor__IO=ENTRY__CAM=GroundFloor-Stair,BR=TMJ-CBE__ZN=GroundFloor__IO=ENTRY__CAM=GroundFloor-Lift,BR=TMJ-CBE__ZN=Scheme-Billing__IO=BILLING__CAM=FF-Scheme-Bill
  #     # - SFTP_BASE_PATH=/TMJ-CBE-Entry
  #     # - SFTP_CAMERAS_ALLOWLIST=processed
  #     - SFTP_PROCESSED_DIRNAME=
  #     # - SFTP_FILENAME_INCLUDE_ANY=
  #     # - SFTP_FILENAME_EXCLUDE_ANY=
  #     - SFTP_FILENAME_INCLUDE_ANY=FACE_SNAP
  #     - SFTP_FILENAME_EXCLUDE_ANY=FACE_BACKGROUND

  external_api_poller:
    container_name: external_api_poller
    restart: unless-stopped
    depends_on:
      - face_service
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3.11", "external_api_poller.py"]
    environment:
      - CONFIG_PATH=/app/config.yaml
      - API_BASE_URL=http://face_service:8000
      - SYNC_DATE=${SYNC_DATE:-2026-04-18}

      - SFTP_MAX_FILES_PER_CAMERA_PER_TICK=500
      - SFTP_TIMEZONE=Asia/Kolkata
      - SFTP_SINCE_DATETIME=19-04-2026:12 am
      - SFTP_UNTIL_DATETIME=20-04-2026:1 am
    volumes:
      - .:/app:rw

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  events_storage: