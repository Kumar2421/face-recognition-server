services:
  ui:
    image: node:20
    container_name: face_ui
    working_dir: /app
    volumes:
      - ./ui:/app
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8001}
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - face_service

  face_service:
    container_name: face_service
    restart: unless-stopped
    depends_on:
      - qdrant
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ./app.py:/app/app.py
      - ./cross_check.py:/app/cross_check.py
      - ./ui_page.py:/app/ui_page.py
      - ./quality:/app/quality
      - ./embedders:/app/embedders
      - ./src:/app/src
      - ./input:/data/input:ro
      - ./facefolder:/data/facefolder:ro
      - ./buffalo_l/models:/models:rw
      # - ./data/thumbs:/data/thumbs
      # - ./data/images:/data/images
      # - ./images/events:/data/events
      - ./data/thumbs1:/data/thumbs
      - ./data/images1:/data/images
      - ./images/events1:/data/events
      - ./data/trt_cache:/data/trt_cache
      - ./config.yaml:/app/config.yaml:ro

    environment:
      # - FACE_DIR=/media/frigate/facefolder/security
      - FACE_DIR=/data/facefolder/security
      - CONFIG_PATH=/app/config.yaml
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=frigate_faces_v27
      # - QDRANT_COLLECTION=frigate_faces_v10
      # - QDRANT_COLLECTION=frigate_faces_v3
      # - QDRANT_COLLECTION=frigate_faces_v2
      # - QDRANT_COLLECTION=frigate_faces old emp db
      - QDRANT_HNSW_EF=64
      - QDRANT_EXACT=0
      - BUFFALO_MODEL_ROOT=/models
      - BUFFALO_MODEL_NAME=buffalo_l
      - BUFFALO_DET_SIZE=640
      - FACE_SERVICE_DEBUG=1
      - BUFFALO_MIN_DET_SCORE=0.3
      - BUFFALO_ENABLE_FALLBACK_VARIANTS=0
      - BUFFALO_PROVIDERS=CUDAExecutionProvider,CPUExecutionProvider
      - ORT_TENSORRT_ENGINE_CACHE_ENABLE=0
      - ORT_TENSORRT_CACHE_PATH=/data/trt_cache
      - ORT_TENSORRT_FP16_ENABLE=0
      - FACE_EMBEDDINGS_INDEX=/data/facefolder/security_embeddings/index.json
      - GPU_INFERENCE_MANAGER=1
      - GPU_QUEUE_MAX=2048
      - GPU_BATCH_WINDOW_MS=0
      - GPU_NUM_WORKERS=2
      - GPU_JOB_TIMEOUT_SEC=180
      # ONNXRuntime Memory Optimizations
      - ORT_CUDA_MEMORY_LIMIT_MB=2048
      - ORT_CUDA_ARENA_EXTEND_STRATEGY=kSameAsRequested
      # Lean cuDNN workspace (EXHAUSTIVE default reserves GBs per session)
      - ORT_CUDNN_CONV_ALGO_SEARCH=HEURISTIC
      # Load only used models (drop unused genderage + landmark_2d_106)
      - BUFFALO_MODULES=detection,recognition,landmark_3d_68
      - RECOGNITION_LOGGING_ENABLED=1
      - FACE_SERVICE_MAX_FACES_PER_IMAGE=1
      - FACE_SERVICE_FORCE_SINGLE_FACE=1
      - FACE_MIN_RESOLUTION=40
      - FACE_QUALITY_FACE_RATIO_MIN=0.01
      - FACE_QUALITY_BLUR_MIN=35
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://face.service.tools.thefusionapps.com}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AUTO_ADD_EMBEDDING_ENABLE=0
      - AUTO_ADD_EMBEDDING_MIN_SIM=0.80
      - SUBJECT_MAX_EMBEDDINGS=10
      - ENROLL_DUPLICATE_CHECK_ENABLE=0
      - ENROLL_DUPLICATE_MIN_SIM=0.80
      - NO_MATCH_AUTO_ENROLL_ENABLE=0
      - NO_MATCH_AUTO_ENROLL_PREFIX=visiter
      - NO_MATCH_AUTO_ENROLL_BLOCK_MIN_SIM=0.70
      - DATE_WISE_RECOGNITION_FALLBACK_MASTER=0
      - NO_MATCH_AUTO_ATTACH_MIN_SIM=0.55
      - NO_MATCH_AUTO_ATTACH_MIN_MARGIN=0.08
    ports:
      - "8001:8000"

    deploy:
    
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

