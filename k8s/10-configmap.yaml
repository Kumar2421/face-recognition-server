apiVersion: v1
kind: ConfigMap
metadata:
  name: face-service-env
  namespace: face
data:
  # --- paths / config ---
  FACE_DIR: "/data/facefolder/security"
  CONFIG_PATH: "/app/config.yaml"
  EVENTS_DB: "/data/events/events.db"
  # --- qdrant ---
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "frigate_faces_v26"
  QDRANT_HNSW_EF: "64"
  QDRANT_EXACT: "0"
  # --- model ---
  BUFFALO_MODEL_ROOT: "/models"
  BUFFALO_MODEL_NAME: "buffalo_l"
  BUFFALO_DET_SIZE: "640"
  BUFFALO_MIN_DET_SCORE: "0.3"
  BUFFALO_ENABLE_FALLBACK_VARIANTS: "0"
  BUFFALO_PROVIDERS: "CUDAExecutionProvider,CPUExecutionProvider"
  FACE_SERVICE_DEBUG: "1"
  # --- onnxruntime / tensorrt ---
  ORT_TENSORRT_ENGINE_CACHE_ENABLE: "0"
  ORT_TENSORRT_CACHE_PATH: "/data/trt_cache"
  ORT_TENSORRT_FP16_ENABLE: "0"
  ORT_CUDA_MEMORY_LIMIT_MB: "4096"
  ORT_CUDA_ARENA_EXTEND_STRATEGY: "kSameAsRequested"
  # --- embeddings index ---
  FACE_EMBEDDINGS_INDEX: "/data/facefolder/security_embeddings/index.json"
  # --- gpu inference manager ---
  GPU_INFERENCE_MANAGER: "1"
  GPU_QUEUE_MAX: "2048"
  GPU_BATCH_WINDOW_MS: "0"
  GPU_NUM_WORKERS: "2"
  GPU_JOB_TIMEOUT_SEC: "180"
  EMBED_THREADS: "2"
  BRANCH_CACHE_TTL: "300"
  # --- recognition / quality ---
  RECOGNITION_LOGGING_ENABLED: "1"
  FACE_SERVICE_MAX_FACES_PER_IMAGE: "1"
  FACE_SERVICE_FORCE_SINGLE_FACE: "1"
  FACE_MIN_RESOLUTION: "40"
  FACE_QUALITY_FACE_RATIO_MIN: "0.01"
  FACE_QUALITY_BLUR_MIN: "35"
  CORS_ALLOW_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://face.service.tools.thefusionapps.com"
  # --- nvidia ---
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  # --- enroll / auto-add ---
  AUTO_ADD_EMBEDDING_ENABLE: "1"
  AUTO_ADD_EMBEDDING_MIN_SIM: "0.80"
  SUBJECT_MAX_EMBEDDINGS: "10"
  ENROLL_DUPLICATE_CHECK_ENABLE: "0"
  ENROLL_DUPLICATE_MIN_SIM: "0.80"
  NO_MATCH_AUTO_ENROLL_ENABLE: "0"
  NO_MATCH_AUTO_ENROLL_PREFIX: "visiter"
  NO_MATCH_AUTO_ENROLL_BLOCK_MIN_SIM: "0.70"
  DATE_WISE_RECOGNITION_FALLBACK_MASTER: "0"
  NO_MATCH_AUTO_ATTACH_MIN_SIM: "0.55"
  NO_MATCH_AUTO_ATTACH_MIN_MARGIN: "0.08"
