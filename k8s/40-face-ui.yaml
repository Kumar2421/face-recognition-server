apiVersion: v1
kind: Service
metadata:
  name: face-ui
  namespace: face
  labels:
    app: face-ui
spec:
  type: NodePort
  selector:
    app: face-ui
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30173     # external: <node-ip>:30173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-ui
  namespace: face
spec:
  replicas: 1
  strategy:
    type: Recreate         # ui source is a single hostPath (RWO-style) mount
  selector:
    matchLabels:
      app: face-ui
  template:
    metadata:
      labels:
        app: face-ui
    spec:
      containers:
        - name: face-ui
          image: node:20
          workingDir: /app
          command: ["bash", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
          env:
            - name: VITE_API_BASE
              value: "http://localhost:8001"   # browser-facing; set to your node URL
          ports:
            - containerPort: 5173
          volumeMounts:
            - name: ui
              mountPath: /app
      volumes:
        - name: ui
          hostPath:
            path: /home/fusion-gpu/fusion-projects/face-recognition-server/ui
            type: Directory
